<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Choral Core — The Center of Every Deal</title>
  <style>
    :root {
      --navy: #0b1220;
      --navy-deep: #050912;
      --slate: #41566b;
      --gold: #d4a437;
      --gold-deep: #b9851b;
      --cream: #f6efe3;
      --line: rgba(11, 18, 32, 0.12);
      --font: "Avenir Next", "Inter", "Helvetica Neue", Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      color: var(--navy);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      background: var(--cream);
      overflow-x: hidden;
    }

    /* Background — navy "ink" enters at the bottom-left under the headline
       and bleeds all the way along the bottom to the right edge. Above the
       bottom band the page returns to a soft cream so the text stays
       readable. A warm amber glow rides directly under the gold lines. */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        /* warm amber glow that traces the nerve bundle */
        radial-gradient(60% 50% at 22% 92%, rgba(255, 200, 110, 0.45) 0%, rgba(212, 164, 55, 0.18) 35%, rgba(11,18,32,0) 70%),
        /* navy band sweeping left-to-right along the bottom */
        linear-gradient(95deg, #050912 0%, #0b1220 22%, #142033 48%, #1d2c46 72%, #243657 100%),
        /* the cream wash everywhere above */
        linear-gradient(180deg, #f6efe3 0%, #efe6d6 60%, #cdd3dc 100%);
      background-size: 100% 100%, 100% 78%, 100% 100%;
      background-position: 0 0, 0 100%, 0 0;
      background-repeat: no-repeat, no-repeat, no-repeat;
    }
    /* Soft fade from cream into the navy band */
    .bg::after {
      content: "";
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 86%;
      background: linear-gradient(180deg, rgba(246,239,227,1) 0%, rgba(246,239,227,0.85) 18%, rgba(246,239,227,0.0) 42%);
      pointer-events: none;
    }
    .bg svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* Header / nav */
    header {
      position: relative;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: clamp(20px, 2.4vw, 32px) clamp(28px, 4.5vw, 64px);
    }
    .brand {
      display: inline-flex;
      gap: 14px;
      align-items: center;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.28em;
      color: var(--navy);
      text-transform: uppercase;
      text-decoration: none;
    }
    .brand .star { width: 22px; height: 22px; display: inline-block; }
    nav.primary {
      display: flex;
      align-items: center;
      gap: clamp(18px, 2.4vw, 36px);
    }
    nav.primary a {
      color: var(--navy);
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
    }
    nav.primary a:hover { color: var(--gold-deep); }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      border: 0;
      cursor: pointer;
      border-radius: 10px;
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .btn-gold {
      background: var(--gold-deep);
      color: #fff;
      box-shadow: 0 6px 20px -10px rgba(185, 133, 27, 0.7);
    }
    .btn-gold:hover { background: #a3741a; transform: translateY(-1px); }
    .btn-light {
      background: #ffffff;
      color: var(--navy);
      border: 1px solid var(--line);
    }
    .btn-light:hover { background: #fffdf7; }

    /* Hero */
    main {
      position: relative;
      z-index: 2;
      padding: clamp(20px, 4vw, 56px) clamp(28px, 4.5vw, 64px) clamp(48px, 8vw, 96px);
      min-height: calc(100vh - 100px);
      display: flex;
      align-items: center;
    }
    .hero { width: min(640px, 100%); }
    h1 {
      margin: 0 0 22px;
      font-size: clamp(48px, 7vw, 96px);
      font-weight: 700;
      line-height: 0.98;
      letter-spacing: -0.02em;
      color: var(--navy);
    }
    .lede {
      margin: 0 0 36px;
      color: var(--slate);
      font-size: clamp(17px, 1.5vw, 20px);
      line-height: 1.55;
      max-width: 460px;
    }
    .actions { display: flex; gap: 14px; flex-wrap: wrap; }
    .btn-light .play {
      width: 22px; height: 22px;
      border-radius: 50%;
      border: 1.5px solid var(--navy);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn-light .play svg { width: 9px; height: 9px; }

    /* Gentle pulse on neurons, slow drift on the bundle */
    @keyframes drift {
      0%   { transform: translate(0, 0); }
      50%  { transform: translate(4px, -3px); }
      100% { transform: translate(0, 0); }
    }
    .bundle { animation: drift 18s ease-in-out infinite; transform-origin: 18% 92%; }

    @keyframes pulse {
      0%, 100% { opacity: 0.85; }
      50%      { opacity: 1; }
    }

    @media (max-width: 860px) {
      nav.primary a { display: none; }
      nav.primary .btn-gold { display: inline-flex; }
    }
    @media (max-width: 520px) {
      header { padding: 18px 22px; }
      main { padding: 12px 22px 60px; }
      h1 { font-size: 44px; }
      .lede { font-size: 16px; }
    }
  </style>
</head>
<body>
  <!-- Background gradient + nerve-fiber strand -->
  <div class="bg" aria-hidden="true">
    <svg viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- The amber glow that lives *under* the fibers and gives the
             bundle its halo. Strong at the source, fading along the path. -->
        <radialGradient id="halo" cx="22%" cy="92%" r="46%">
          <stop offset="0%"  stop-color="#ffd87a" stop-opacity="0.7"/>
          <stop offset="22%" stop-color="#e7b94a" stop-opacity="0.45"/>
          <stop offset="55%" stop-color="#b9851b" stop-opacity="0.15"/>
          <stop offset="100%" stop-color="#0b1220" stop-opacity="0"/>
        </radialGradient>
        <!-- A second, narrower, elongated glow that traces the strand's
             general direction (up-and-to-the-right) — this is the
             "flowing gradient underneath the lines". -->
        <linearGradient id="under" x1="0" y1="1" x2="1" y2="0.45">
          <stop offset="0%"   stop-color="#ffd87a" stop-opacity="0.55"/>
          <stop offset="35%"  stop-color="#d4a437" stop-opacity="0.28"/>
          <stop offset="70%"  stop-color="#b9851b" stop-opacity="0.08"/>
          <stop offset="100%" stop-color="#b9851b" stop-opacity="0"/>
        </linearGradient>

        <!-- Each fiber's stroke fades from bright (source) to dim (tail) -->
        <linearGradient id="fiber" x1="0" y1="1" x2="1" y2="0.3">
          <stop offset="0%"   stop-color="#fff4c8" stop-opacity="1"/>
          <stop offset="20%"  stop-color="#ffe9a8" stop-opacity="0.95"/>
          <stop offset="50%"  stop-color="#e7b94a" stop-opacity="0.7"/>
          <stop offset="80%"  stop-color="#b9851b" stop-opacity="0.25"/>
          <stop offset="100%" stop-color="#b9851b" stop-opacity="0"/>
        </linearGradient>

        <filter id="fiberGlow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="0.9" result="b"/>
          <feMerge>
            <feMergeNode in="b"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
        <filter id="neuronGlow" x="-200%" y="-200%" width="500%" height="500%">
          <feGaussianBlur stdDeviation="2.6" result="b"/>
          <feMerge>
            <feMergeNode in="b"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>

      <!-- Underlying glow halos: a broad amber halo + a directional
           "flow" gradient that follows the strand. -->
      <ellipse cx="350" cy="920" rx="560" ry="380" fill="url(#halo)"/>
      <path d="M -40 1020 L 1280 380 L 1640 220 L 1640 1080 L -40 1080 Z" fill="url(#under)" opacity="0.45"/>

      <!-- The nerve bundle. All fibers spawn from a tight cluster near
           (180, 940) and splay chaotically up and to the right. Control
           points are deliberately uneven so the bundle feels organic
           rather than ribbon-like. -->
      <g class="bundle" filter="url(#fiberGlow)" fill="none" stroke="url(#fiber)" stroke-linecap="round">
        <!-- Tight core fibers, almost overlapping at the source -->
        <path d="M 150 970 C 280 940, 420 900, 600 860 S 900 800, 1180 760" stroke-width="1.6" opacity="1"/>
        <path d="M 160 960 C 300 928, 440 880, 620 836 S 920 770, 1200 720" stroke-width="1.4" opacity="0.95"/>
        <path d="M 170 950 C 310 915, 450 855, 640 800 S 940 720, 1220 670" stroke-width="1.3" opacity="0.9"/>
        <path d="M 180 942 C 320 900, 460 830, 660 770 S 960 680, 1240 620" stroke-width="1.2" opacity="0.88"/>
        <path d="M 190 935 C 330 880, 480 800, 680 740 S 980 640, 1260 580" stroke-width="1.1" opacity="0.85"/>

        <!-- Mid-fan fibers, peeling off chaotically -->
        <path d="M 175 950 C 290 880, 430 760, 640 680 S 960 560, 1280 500" stroke-width="1.0" opacity="0.8"/>
        <path d="M 185 944 C 280 850, 430 700, 660 600 S 980 460, 1300 400" stroke-width="0.95" opacity="0.72"/>
        <path d="M 195 938 C 270 820, 430 640, 680 520 S 1000 360, 1320 300" stroke-width="0.9" opacity="0.65"/>
        <path d="M 205 932 C 260 780, 430 580, 700 440 S 1020 260, 1340 220" stroke-width="0.85" opacity="0.55"/>
        <path d="M 215 928 C 250 740, 430 500, 720 380 S 1040 200, 1360 160" stroke-width="0.8" opacity="0.45"/>

        <!-- A handful of low-hugging fibers near the source for density -->
        <path d="M 140 985 C 280 970, 440 960, 620 950 S 920 930, 1180 920" stroke-width="1.1" opacity="0.7"/>
        <path d="M 120 1000 C 280 990, 460 990, 660 985 S 960 970, 1220 960" stroke-width="0.95" opacity="0.55"/>
        <path d="M 100 1015 C 280 1010, 480 1010, 700 1010 S 1000 1000, 1280 990" stroke-width="0.85" opacity="0.4"/>

        <!-- Two stray fibers for asymmetric chaos -->
        <path d="M 160 955 C 240 905, 400 870, 580 830 Q 760 800, 920 810" stroke-width="0.9" opacity="0.55"/>
        <path d="M 195 938 C 300 870, 480 800, 660 720 Q 840 660, 1020 660" stroke-width="0.85" opacity="0.5"/>
      </g>

      <!-- Hand-placed bright neurons clustered at the source so the bundle
           reads even before the script adds more along each fiber. -->
      <g class="neurons" filter="url(#neuronGlow)">
        <circle cx="190" cy="950" r="4.0" fill="#fff8d6" opacity="1"  style="animation: pulse 4.2s ease-in-out infinite"/>
        <circle cx="250" cy="930" r="3.0" fill="#ffe49a" opacity="0.95"/>
        <circle cx="320" cy="908" r="3.6" fill="#fff4c8" opacity="0.95" style="animation: pulse 5s ease-in-out infinite"/>
        <circle cx="400" cy="884" r="2.6" fill="#f3c96d" opacity="0.9"/>
        <circle cx="480" cy="858" r="3.2" fill="#fff4c8" opacity="0.9"/>
        <circle cx="560" cy="828" r="2.4" fill="#ffd882" opacity="0.85"/>
        <circle cx="640" cy="796" r="2.6" fill="#ffe9a8" opacity="0.85"/>
        <circle cx="720" cy="760" r="3.0" fill="#fff4c8" opacity="0.85" style="animation: pulse 6s ease-in-out infinite"/>
        <circle cx="800" cy="724" r="2.0" fill="#e7b94a" opacity="0.8"/>
        <circle cx="880" cy="690" r="2.4" fill="#ffe9a8" opacity="0.78"/>
        <circle cx="960" cy="658" r="2.0" fill="#ffd882" opacity="0.75"/>
        <circle cx="1040" cy="624" r="2.2" fill="#fff4c8" opacity="0.7"/>

        <!-- "Junction" neurons — larger with a soft ring -->
        <g style="animation: pulse 7s ease-in-out infinite">
          <circle cx="270" cy="922" r="6" fill="none" stroke="#ffd882" stroke-width="0.6" opacity="0.7"/>
          <circle cx="270" cy="922" r="2.6" fill="#fff8d6"/>
        </g>
        <g style="animation: pulse 5.5s ease-in-out infinite">
          <circle cx="540" cy="820" r="6" fill="none" stroke="#ffd882" stroke-width="0.5" opacity="0.6"/>
          <circle cx="540" cy="820" r="2.4" fill="#fff4c8"/>
        </g>
        <g style="animation: pulse 6.5s ease-in-out infinite">
          <circle cx="820" cy="700" r="6" fill="none" stroke="#ffd882" stroke-width="0.5" opacity="0.55"/>
          <circle cx="820" cy="700" r="2.2" fill="#ffe9a8"/>
        </g>

        <!-- A couple of star sparks for visual punctuation -->
        <path d="M 360 880 l 0 -10 l 1.6 8.4 l 8 1.6 l -8 1.6 l -1.6 8.4 l -1.6 -8.4 l -8 -1.6 l 8 -1.6 z"
              fill="#fff4c8" opacity="0.95"/>
        <path d="M 700 740 l 0 -8 l 1.4 7 l 7 1.4 l -7 1.4 l -1.4 7 l -1.4 -7 l -7 -1.4 l 7 -1.4 z"
              fill="#ffe9a8" opacity="0.85"/>
      </g>
    </svg>
  </div>

  <!-- Header -->
  <header>
    <a href="#" class="brand" aria-label="Choral Core home">
      <span>CHORAL</span>
      <svg class="star" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <g fill="#d4a437">
          <path d="M12 2 L13 10 L21 11 L13 12 L12 22 L11 12 L3 11 L11 10 Z"/>
          <path d="M12 2 L13 10 L21 11 L13 12 L12 22 L11 12 L3 11 L11 10 Z" transform="rotate(45 12 12)"/>
        </g>
        <circle cx="12" cy="12" r="1.6" fill="#0b1220"/>
      </svg>
      <span>CORE</span>
    </a>
    <nav class="primary" aria-label="Primary">
      <a href="#platform">Platform</a>
      <a href="#solutions">Solutions</a>
      <a href="#resources">Resources</a>
      <a href="#company">Company</a>
      <a href="#demo" class="btn btn-gold">Request a Demo</a>
    </nav>
  </header>

  <!-- Hero -->
  <main>
    <section class="hero">
      <h1>The Center<br/>of Every Deal.</h1>
      <p class="lede">One platform. Every participant.<br/>Perfectly in sync.</p>
      <div class="actions">
        <a href="#demo" class="btn btn-gold">Request a Demo</a>
        <a href="#how" class="btn btn-light">
          See How It Works
          <span class="play" aria-hidden="true">
            <svg viewBox="0 0 10 10" xmlns="http://www.w3.org/2000/svg"><path d="M2 1.5 L8 5 L2 8.5 Z" fill="#0b1220"/></svg>
          </span>
        </a>
      </div>
    </section>
  </main>

  <script>
    // Scatter neurons directly *on* each fiber. Density is highest near
    // the source (bottom-left) and tapers as fibers trail toward the
    // upper-right — the same way real myelinated fibers thin out.
    (function () {
      const svg = document.querySelector('.bg svg');
      if (!svg) return;
      const paths = svg.querySelectorAll('.bundle path');
      const group = svg.querySelector('.neurons');
      const svgNS = 'http://www.w3.org/2000/svg';
      const palette = ['#fff8d6', '#fff4c8', '#ffe9a8', '#ffd882', '#e7b94a'];

      paths.forEach((p, i) => {
        const total = p.getTotalLength();
        const count = 9 + (i % 4);
        for (let n = 0; n < count; n++) {
          // Bias t small → cluster near the source end.
          const t = Math.pow(Math.random(), 1.7);
          const pt = p.getPointAtLength(total * (0.02 + t * 0.9));
          const bright = 1 - t * 0.78;
          if (bright < 0.18) continue;
          const c = document.createElementNS(svgNS, 'circle');
          c.setAttribute('cx', pt.x.toFixed(1));
          c.setAttribute('cy', pt.y.toFixed(1));
          const isJunction = Math.random() < 0.08;
          const r = (isJunction ? 2.8 : 1.2) + Math.random() * 1.1;
          c.setAttribute('r', r.toFixed(2));
          c.setAttribute('fill', palette[Math.floor(Math.random() * palette.length)]);
          c.setAttribute('opacity', bright.toFixed(2));
          group.appendChild(c);

          // For a few neurons, add a faint outer ring — like an active
          // synaptic junction.
          if (isJunction && bright > 0.6) {
            const ring = document.createElementNS(svgNS, 'circle');
            ring.setAttribute('cx', pt.x.toFixed(1));
            ring.setAttribute('cy', pt.y.toFixed(1));
            ring.setAttribute('r', (r * 2.2).toFixed(2));
            ring.setAttribute('fill', 'none');
            ring.setAttribute('stroke', '#ffd882');
            ring.setAttribute('stroke-width', '0.5');
            ring.setAttribute('opacity', (bright * 0.55).toFixed(2));
            group.appendChild(ring);
          }
        }
      });
    })();
  </script>
</body>
</html>
